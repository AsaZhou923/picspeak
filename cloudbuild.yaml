substitutions:
  _AR_HOSTNAME: asia-northeast1-docker.pkg.dev
  _AR_PROJECT_ID: project-f26ea384-25df-4d69-a78
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: asia-northeast1
  _SERVICE_NAME: picspeak-api
  _MIGRATION_JOB: picspeak-db-migrate
  _DATABASE_SECRET: picspeak-supabase-database-url
  _RUNTIME_SERVICE_ACCOUNT: 781338217290-compute@developer.gserviceaccount.com
  # Manual `gcloud builds submit` runs have no BRANCH_NAME and are refused by
  # BranchGuard unless the operator passes
  # `--substitutions=_ALLOW_NON_MAIN_DEPLOY=true`. The override never admits a
  # triggered build from a branch other than main.
  _ALLOW_NON_MAIN_DEPLOY: 'false'

steps:
  # Second line of defence behind the trigger's branch filter (issue #134): the
  # filter is an RE2 regex, so `main` also matched branches such as
  # `test/e2e-main-flow`. Every other step waits on this one, so a non-main
  # build fails before Build, Push, Migrate or Deploy run. Branch names may
  # contain $, backticks, quotes or ;, so the substituted values reach bash only
  # through env and the script reads them as quoted runtime variables.
  - id: BranchGuard
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - GUARD_BRANCH=$BRANCH_NAME
      - GUARD_ALLOW=$_ALLOW_NON_MAIN_DEPLOY
    args:
      - -ceu
      - |
        if [ "$$GUARD_BRANCH" = "main" ]; then
          echo "BranchGuard: building main; deployment allowed."
        elif [ -z "$$GUARD_BRANCH" ] && [ "$$GUARD_ALLOW" = "true" ]; then
          echo "BranchGuard: manual build with _ALLOW_NON_MAIN_DEPLOY=true; deployment allowed." >&2
        else
          echo "BranchGuard: refusing to deploy branch '$$GUARD_BRANCH'; only main deploys to production." >&2
          echo "BranchGuard: manual builds without a branch need --substitutions=_ALLOW_NON_MAIN_DEPLOY=true." >&2
          exit 1
        fi

  - id: Pull
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    waitFor:
      - BranchGuard
    args:
      - -ceu
      - |
        if ! docker pull "$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest"; then
          echo "WARNING: optional cache image unavailable; building without a warm cache." >&2
        fi

  - id: Build
    name: gcr.io/cloud-builders/docker
    waitFor:
      - Pull
    args:
      - build
      - --cache-from
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - -f
      - backend/Dockerfile
      - backend

  - id: Push
    name: gcr.io/cloud-builders/docker
    waitFor:
      - Build
    args:
      - push
      - --all-tags
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME

  - id: Migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    waitFor:
      - Push
    args:
      - run
      - jobs
      - deploy
      - $_MIGRATION_JOB
      - --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - --region=$_DEPLOY_REGION
      - --service-account=$_RUNTIME_SERVICE_ACCOUNT
      - --command=python
      - --args=scripts/ensure_runtime_schema.py
      - --set-secrets=DATABASE_URL=$_DATABASE_SECRET:latest
      - --tasks=1
      - --parallelism=1
      - --max-retries=0
      - --task-timeout=10m
      - --execute-now
      - --wait
      - --quiet

  - id: RenderEnv
    name: python:3.11-slim
    entrypoint: bash
    waitFor:
      - BranchGuard
    args:
      - -ceu
      - |
        python deploy/render-cloud-run-env.py deploy/cloud-run-env.yaml > /workspace/cloud-run-env.rendered
        test -s /workspace/cloud-run-env.rendered

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    waitFor:
      - Migrate
      - RenderEnv
    args:
      - -ceu
      - |
        UPDATE_ENV_VARS="$$(cat /workspace/cloud-run-env.rendered)"
        test -n "$$UPDATE_ENV_VARS"
        gcloud run services update "$_SERVICE_NAME" \
          "--image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA" \
          "--update-labels=managed-by=gcp-cloud-build-deploy-cloud-run,gcb-trigger-region=$LOCATION,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID" \
          "--update-env-vars=$$UPDATE_ENV_VARS" \
          "--region=$_DEPLOY_REGION" \
          --quiet

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest

options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  substitutionOption: ALLOW_LOOSE

tags:
  - gcp-cloud-build-deploy-cloud-run
  - picspeak-api

timeout: 1200s
