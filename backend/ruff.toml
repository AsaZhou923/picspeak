target-version = "py311"

[lint]
# Pin Ruff's classic minimal default rule set (pycodestyle E4/E7/E9 + Pyflakes F)
# so future Ruff releases do not introduce unrelated style churn.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Alembic, maintenance scripts, and tests bootstrap sys.path before importing `app.*`.
"alembic/env.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
# Compatibility re-export shims imported by routes, scripts, and tests.
"app/api/routers/gallery.py" = ["F401"]
"app/api/routers/reviews.py" = ["F401"]
