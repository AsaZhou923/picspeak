# Production Cloud Run environment overrides for picspeak-api.
# Single source of truth consumed by both cloudbuild.yaml and
# deploy/deploy-backend.bat via deploy/render-cloud-run-env.py to build
# the `--update-env-vars` argument.
#
# IMPORTANT: Do NOT pass this file to `gcloud run deploy --env-vars-file`.
# That flag replaces ALL environment variables on the Cloud Run service and
# would remove secrets and runtime variables managed outside this file.

OPENAI_SCORE_MODEL: "gpt-6-sol"
OPENAI_REVIEW_MODEL: "gpt-6-sol"
RETAKE_ANALYSIS_MODEL: "gpt-6.1-sol"
OPENAI_SCORE_REASONING_EFFORT: "low"
OPENAI_REVIEW_REASONING_EFFORT: "low"
RETAKE_ANALYSIS_REASONING_EFFORT: "high"
OPENAI_PRO_MODEL: "gpt-6.1-sol"
OPENAI_PRO_REASONING_EFFORT: "high"
NOTIFICATIONS_READ_ENABLED: "true"
NOTIFICATIONS_EVENT_CAPTURE_ENABLED: "true"
NOTIFICATIONS_WORKER_ENABLED: "true"
LEMONSQUEEZY_CHECKOUT_TEST_MODE: "false"
LEMONSQUEEZY_WEBHOOK_TEST_MODE: "false"
LEMONSQUEEZY_PRO_ONE_TIME_CHECKOUT_URL: "https://picspeak.lemonsqueezy.com/checkout/buy/c2fbdd32-49e0-4dd6-9924-4d85d5e27522"
LEMONSQUEEZY_PRO_ONE_TIME_VARIANT_ID: "1445229"
GUEST_REVIEW_LIMIT_PER_DAY: "1"
PRO_REVIEW_SOFT_LIMIT_PER_MONTH: "150"
PRO_REVIEW_SOFT_LIMIT_RATE_PER_MINUTE: "2"
