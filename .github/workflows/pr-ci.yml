name: PR CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend-pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/picspeak_test
      PICSPEAK_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/picspeak_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: picspeak_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d picspeak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Verify PostgreSQL migration cycle
        run: |
          python scripts/ensure_runtime_schema.py
          python -m alembic downgrade 20260523_0003
          python -m alembic upgrade head
      - name: Run backend pytest
        run: python -m pytest tests

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_SITE_URL: https://picspeak.example.com
      NEXT_PUBLIC_GOOGLE_OAUTH_REDIRECT_URI: https://api.example.com/api/v1/auth/google/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Run frontend typecheck
        run: npm run typecheck
      - name: Run frontend lint
        run: npm run lint
      - name: Run frontend build
        run: npm run build
